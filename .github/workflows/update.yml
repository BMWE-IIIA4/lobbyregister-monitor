name: Lobbyregister Monitor

on:
  schedule:
    # Täglich um 01:00 UTC = 02:00 MEZ (Winter) / 03:00 MESZ (Sommer)
    # Um konsistent 02:00 Berliner Winterzeit zu haben: 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:       # Manueller Start jederzeit möglich
    inputs:
      force_email:
        description: 'E-Mail trotzdem versenden? (nur bei manuellem Start)'
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: Europe/Berlin  # Zeitzone für alle Schritte setzen

permissions:
  contents: write   # write benoetigt fuer Push in data-store-Branch (Datenpersistenz)
  pages: write
  id-token: write

jobs:
  build-site:
    name: Seite aktualisieren (taeglich)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: pip install requests ijson

      - name: Datenbestand aus data-store-Branch laden
        # Persistenz der Bestandsdaten (data.json, gemini_cache.json,
        # run_history.json) erfolgt ueber den separaten Branch 'data-store',
        # NICHT mehr ueber den fluechtigen GitHub Actions Cache. Der Branch
        # wird bei Bedarf automatisch (leer) angelegt.
        run: |
          set -e
          git fetch origin data-store:data-store 2>/dev/null || {
            echo "Branch data-store existiert noch nicht – wird beim ersten Push erzeugt."
          }
          mkdir -p docs
          if git rev-parse --verify data-store >/dev/null 2>&1; then
            for f in data.json gemini_cache.json run_history.json; do
              if git show data-store:$f >/dev/null 2>&1; then
                git show data-store:$f > docs/$f
                echo "Geladen: $f ($(stat -c%s docs/$f) Bytes)"
              else
                echo "Hinweis: $f noch nicht im data-store vorhanden."
              fi
            done
          else
            echo "Hinweis: data-store-Branch leer/nicht vorhanden – Erstlauf."
          fi

      - name: Daten abrufen (Suchschnittstelle, gestreamt)
        run: python scripts/fetch_and_build.py

      - name: Gemini-Anreicherung (Relevanzfilter + Zusammenfassungen + HTML-Rebuild)
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        run: python scripts/gemini_enrich.py
        continue-on-error: true

      - name: Notfall-Healthcheck bei Gemini-Fehler
        if: steps.gemini.outcome == 'failure'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          LOBBYREGISTER_API_KEY: ${{ secrets.LOBBYREGISTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: "https://lobbyregister-bot.de"
        run: python scripts/health_check.py
        continue-on-error: true

      - name: Admin-Panel Passwort-Hash einfuegen
        env:
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
        run: python scripts/inject_admin_hash.py

      - name: Workflow-Protokoll speichern
        env:
          INPUT_FORCE_EMAIL: ${{ github.event.inputs.force_email || 'false' }}
        run: python scripts/save_run_log.py
        continue-on-error: true

      - name: Datenbestand in data-store-Branch persistieren
        # Schreibt data.json, gemini_cache.json und run_history.json in den
        # data-store-Branch zurueck. Erfolgt vor dem Pages-Deploy, damit der
        # Datenbestand auch dann gesichert ist, wenn der Deploy fehlschlaegt.
        # Der Branch enthaelt ausschliesslich die drei Datendateien (keine
        # Code-Historie, keine Verschmutzung des main-Branches).
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Temp-Verzeichnis fuer den Branch-Inhalt
          STORE_DIR=$(mktemp -d)
          cd "$STORE_DIR"
          git init -q -b data-store
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # Bestehenden Branch laden (falls vorhanden) – sonst neu anlegen
          if git fetch -q origin data-store 2>/dev/null; then
            git reset --hard origin/data-store
          fi

          # Dateien aus dem Workspace uebernehmen
          for f in data.json gemini_cache.json run_history.json; do
            if [ -f "$GITHUB_WORKSPACE/docs/$f" ]; then
              cp "$GITHUB_WORKSPACE/docs/$f" "./$f"
            fi
          done

          # README im data-store-Branch (nur einmal noetig)
          if [ ! -f README.md ]; then
            cat > README.md <<'EOF'
          # data-store

          Dieser Branch enthaelt ausschliesslich die persistenten Datenbestaende
          des Lobbyregister-Monitors:

          - data.json
          - gemini_cache.json
          - run_history.json

          Er wird automatisch durch den Workflow `update.yml` aktualisiert.
          Bitte hier KEINE manuellen Commits vornehmen.
          EOF
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "Keine Aenderungen am Datenbestand – kein Commit noetig."
          else
            git commit -q -m "data: update ${{ github.run_id }} ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
            git push -q origin data-store
            echo "Datenbestand aktualisiert und gepusht."
          fi

      - name: data.json fuer Mail-Job speichern
        uses: actions/upload-artifact@v4
        with:
          name: lobbyregister-data
          path: docs/data.json
          retention-days: 7

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Dateien hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4

  send-email:
    name: Woechentliche Mail versenden (montags, nur automatisch)
    runs-on: ubuntu-latest
    needs: build-site
    # Nur ausführen wenn:
    # 1. Automatischer Schedule-Run (nicht manuell) ODER
    # 2. Manuell mit force_email=true
    if: |
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.force_email == 'true')
    steps:
      - name: Wochentag pruefen
        id: check_day
        run: |
          # Zeitzone auf Berlin setzen
          export TZ=Europe/Berlin
          DAY=$(date +%u)
          echo "weekday=$DAY" >> $GITHUB_OUTPUT
          echo "Heute ist Wochentag $DAY (1=Montag)"
          if [ "$DAY" = "1" ]; then
            echo "is_monday=true" >> $GITHUB_OUTPUT
          else
            echo "is_monday=false" >> $GITHUB_OUTPUT
          fi

      - name: Repository auschecken
        if: steps.check_day.outputs.is_monday == 'true'
        uses: actions/checkout@v4

      - name: Python einrichten
        if: steps.check_day.outputs.is_monday == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        if: steps.check_day.outputs.is_monday == 'true'
        run: pip install requests

      - name: Daten vom Build-Job laden
        if: steps.check_day.outputs.is_monday == 'true'
        uses: actions/download-artifact@v4
        with:
          name: lobbyregister-data
          path: docs

      - name: E-Mail versenden
        if: steps.check_day.outputs.is_monday == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          SITE_URL: "https://lobbyregister-bot.de"
        run: python scripts/send_email.py

  health-check:
    name: Woechentlicher Selbsttest (montags, nur automatisch)
    runs-on: ubuntu-latest
    needs: build-site
    # Nur bei automatischem Schedule-Run (nicht manuell)
    if: github.event_name == 'schedule'
    steps:
      - name: Wochentag pruefen
        id: check_day
        run: |
          export TZ=Europe/Berlin
          DAY=$(date +%u)
          if [ "$DAY" = "1" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Repository auschecken
        if: steps.check_day.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Python einrichten
        if: steps.check_day.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        if: steps.check_day.outputs.run == 'true'
        run: pip install requests ijson

      - name: Selbsttest durchfuehren
        if: steps.check_day.outputs.run == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          LOBBYREGISTER_API_KEY: ${{ secrets.LOBBYREGISTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: "https://lobbyregister-bot.de"
        run: python scripts/health_check.py
        continue-on-error: true
